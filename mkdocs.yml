site_name: PonoTech Web ドキュメント
site_description: ポノテク株式会社 コーポレートサイト リニューアルプロジェクト 設計・運用ドキュメント
site_url: https://cazy06.github.io/test-ptch-website/docs-site/
repo_url: https://github.com/cazy06/test-ptch-website
repo_name: cazy06/test-ptch-website
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: docs-site

theme:
  name: material
  language: ja
  palette:
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.action.edit
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

nav:
  - ホーム: index.md
  - ブランド:
    - デザインガイドライン: brand/design-guidelines.md
  - プロダクト:
    - ペルソナ: product/personas.md
    - ジャーニーマップ: product/journey-maps.md
    - UX要件定義: product/ux-requirements.md
  - コンテンツ:
    - コンテンツマップ: content/content-map.md
    - サイト構造・IA: content/site-structure.md
  - 開発:
    - テックスタック: development/tech-stack.md
    - デプロイ手順: development/deployment.md
    - 開発規約・命名ルール: development/conventions.md
  - 変更履歴: changelog.md

markdown_extensions:
  - tables
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cazy06/test-ptch-website
